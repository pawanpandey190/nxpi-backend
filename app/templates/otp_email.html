<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
    .container { max-width: 500px; background: #ffffff; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { color: #1a1a1a; margin-top: 0; }
    .otp-code { font-size: 32px; font-weight: bold; letter-spacing: 6px; color: #2563eb; background: #eff6ff; padding: 16px; text-align: center; border-radius: 8px; margin: 24px 0; }
    p { color: #555555; line-height: 1.6; }
    .footer { margin-top: 30px; font-size: 12px; color: #999999; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h2>NXPI Verification Code</h2>
    <p>Hello,</p>
    <p>Your verification code for Negentrophi NXPI is:</p>
    <div class="otp-code">{{ otp_code }}</div>
    <p>This code is valid for <strong>{{ expire_minutes }} minutes</strong>. If you did not request this code, please ignore this email.</p>
    <div class="footer">
      &copy; Negentrophi. All rights reserved.
    </div>
  </div>
</body>
</html>
